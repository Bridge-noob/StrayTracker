name: Build and attach jars to release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 1.21.8
            java: '21'
            gradle: '9.1.0'
          - mc: 1.21.11
            java: '21'
            gradle: '9.1.0'
          - mc: 26.1.2
            java: '25'
            gradle: '9.8.2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        run: gradle build -PmcVersion=${{ matrix.mc }} --no-daemon

      - name: Find jars
        id: jars
        run: echo "jar=$(ls build/libs/*.jar | grep -v sources | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jars.outputs.jar }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
