name: Bug report
description: Report a problem with StrayTracker
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: dropdown
    id: mcversion
    attributes:
      label: Minecraft version
      options:
        - 1.21.8
        - 1.21.11
        - 26.1.2
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include chat/HUD screenshots if useful. Server log snippets are welcome.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
  - type: input
    id: mods
    attributes:
      label: Other mods installed
      placeholder: Fabric API, ModMenu, ...
