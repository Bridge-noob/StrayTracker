// StrayTracker build script — one build per Minecraft version, each producing its
// own jar (e.g. StrayTracker-1.0.1+1.21.8.jar).
// Usage: gradle build -PmcVersion=1.21.8   (1.21.11 / 26.1.2; default 1.21.11)

def mcVersion = (findProperty('mcVersion') ?: '1.21.11').toString()
ext.mcVersion = mcVersion

buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Loom 1.19.3 (single jar, registers both plugin ids) requires a JVM 25 Gradle daemon.
        // For the Java 21 targets use Loom 1.13.3 (still fully supports MC 1.21.x).
        def _mc = (findProperty('mcVersion') ?: '1.21.11').toString()
        classpath _mc.startsWith('26')
                ? 'net.fabricmc:fabric-loom:1.19.3'    // unobfuscated 26.x — no remapping
                : 'net.fabricmc:fabric-loom:1.13.3'    // obfuscated — remaps with Yarn
    }
}

// Per-Minecraft-version configuration: Yarn build, Fabric API, ModMenu, source tree.
def CONFIG = [
    '1.21.8' : [yarn: '1.21.8+build.1',   fabricApi: '0.136.1+1.21.8',   modmenu: '15.0.2',           src: 'src/yarn8/java'],
    '1.21.11': [yarn: '1.21.11+build.6', fabricApi: '0.141.6+1.21.11', modmenu: '17.0.1',           src: 'src/yarn11/java'],
    '26.1.2' : [yarn: null,              fabricApi: '0.155.3+26.1.2',  modmenu: '21.0.0',           src: 'src/mojang/java'],
]
def cfg = CONFIG[mcVersion]
def isNew = cfg.yarn == null   // 26.x is unobfuscated — no mappings, no remapping

apply plugin: isNew ? 'net.fabricmc.fabric-loom' : 'fabric-loom'

version = "${project.mod_version}+${mcVersion}"
group = project.group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

sourceSets.main.java {
    srcDir cfg.src
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"

    if (isNew) {
        implementation "net.fabricmc:fabric-loader:0.20.1"
        implementation "net.fabricmc.fabric-api:fabric-api:${cfg.fabricApi}"
        compileOnly "com.terraformersmc:modmenu:${cfg.modmenu}"
    } else {
        mappings "net.fabricmc:yarn:${cfg.yarn}:v2"
        modImplementation "net.fabricmc:fabric-loader:0.16.10"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${cfg.fabricApi}"
        modImplementation "com.terraformersmc:modmenu:${cfg.modmenu}"
    }
}

def compileRelease = isNew ? 25 : 21
tasks.withType(JavaCompile).configureEach { options.release = compileRelease }

processResources {
    def props = [version: "${project.mod_version}+${mcVersion}", mcVersion: mcVersion]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

base {
    archivesName = 'StrayTracker'
}
